version: 2

models:
  - name: fct_sales
    description: "Central fact table joining orders, customers and products"
    columns:
      - name: order_id
        tests:
          - not_null
      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: item_price
        tests:
          - not_null

  - name: dim_customers
    description: "Customer dimension with RFM segments"
    columns:
      - name: customer_id
        tests:
          - unique
          - not_null
      - name: customer_segment
        tests:
          - accepted_values:
              values: ['Champions', 'Loyal Customers', 'New Customers', 
                       'At Risk', 'Lost', 'Needs Attention']

  - name: dim_products
    description: "Product dimension with ABC classification"
    columns:
      - name: product_id
        tests:
          - unique
          - not_null
      - name: abc_category
        tests:
          - accepted_values:
              values: ['A - Top Performers', 'B - Mid Performers', 
                       'C - Low Performers']

  - name: dim_dates
    description: "Date dimension for time intelligence"
    columns:
      - name: date_day
        tests:
          - unique
          - not_null